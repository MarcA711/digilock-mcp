[package]
name = "digilock-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server for the TOPTICA DigiLock 110 Remote Control Interface"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "net", "time", "sync", "signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["process"] }
